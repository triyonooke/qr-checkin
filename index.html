<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Scanner Peserta</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 15px;
    background-color: #f4f6f9;
  }

  .container {
    max-width: 360px;
    margin: auto;
  }

  /* Styling untuk pilihan Gate */
  .gate-box {
    margin-bottom: 15px;
    background: #ffffff;
    padding: 10px 15px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    text-align: left;
  }

  .gate-box label {
    font-size: 13px;
    font-weight: bold;
    color: #555;
    display: block;
    margin-bottom: 5px;
  }

  .gate-box select {
    width: 100%;
    padding: 10px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background-color: #fff;
    outline: none;
  }

  #reader {
    width: 100%;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  #hasil {
    margin-top: 15px;
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    background: #ffffff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  .found { color: #2e7d32; background-color: #e8f5e9 !important; }
  .not-found { color: #c62828; background-color: #ffebee !important; }
  .loading { color: #f57c00; background-color: #fff3e0 !important; }
</style>
</head>

<body>

<div class="container">
  <h2>SCAN QR PESERTA</h2>

  <!-- 1. Pilihan Gate/Scanner untuk Petugas -->
  <div class="gate-box">
    <label for="selectGate">📍 Pilih Lokasi Gate / Device:</label>
    <select id="selectGate">
      <option value="Petugas Scanner 1">Petugas Scanner 1</option>
      <option value="Petugas Scanner 2">Petugas Scanner 2</option>
      <option value="Petugas Scanner 3">Petugas Scanner 3</option>
      <option value="Petugas Scanner 4">Petugas Scanner 4</option>
      <option value="Petugas Scanner 5">Petugas Scanner 5</option>
      <option value="Petugas Scanner 6">Petugas Scanner 6</option>
      <option value="Petugas Scanner 7">Petugas Scanner 7</option>
      <option value="Petugas Scanner 8">Petugas Scanner 8</option> 
      <option value="Petugas Scanner 9">Petugas Scanner 9</option>
      <option value="Petugas Scanner 10">Petugas Scanner 10</option>
      <option value="Admin 1">Admin 1</option>
      <option value="Admin 2">Admin 2</option>
      <option value="Supervisor">Supervisor</option>
      <!-- Kamu bisa menambah pilihan Gate 6 - 15 di sini -->
    </select>
  </div>

  <div id="reader"></div>

  <div id="hasil">
    Silakan arahkan QR Code ke kamera
  </div>
</div>

<script>
  // URL Web App Apps Script Kamu
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwy4eMsGyKegJH_Geq9XyP9CkKq9xYrSJ9HcTtAMzSOP5L5N35Ap6PIjKGAOYU4j_Kq7A/exec";

  const html5QrCode = new Html5Qrcode("reader");
  let isScanning = false;

  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    function(decodedText) {
      if (isScanning) return;
      isScanning = true;
      
      const hasilDiv = document.getElementById("hasil");
      // 2. Ambil nilai gate yang sedang dipilih dari dropdown
      const selectedGate = document.getElementById("selectGate").value;

      hasilDiv.className = "loading";
      hasilDiv.innerHTML = `Memeriksa ID: ${decodedText}...<br><small>(${selectedGate})</small>`;

      // 3. Kirim ID dan Nama Gate ke Apps Script
      const formData = new FormData();
      formData.append("id", decodedText);
      formData.append("device", selectedGate); // <-- Dikirim ke Apps Script

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "FOUND") {
          hasilDiv.className = "found";
          hasilDiv.innerHTML = `
          ✅ PESERTA DITEMUKAN<br>
            <b>Nama:</b> ${data.nama}<br>
            <b>Tiket:</b> ${data.tiket}<br>
            <small style="font-weight:normal; color:#555;">Scan via: ${selectedGate}</small>
          `;
        } else if (data.status === "ALREADY_EXISTS") {
          // ⚠️ TAMPILAN JIKA QR DUA KALI DISCAN
          hasilDiv.className = "loading"; // Bisa pakai warna oranye/kuning
          hasilDiv.innerHTML = `
            ⚠️ SUDAH HADIR SEBELUMNYA!<br>
            <b>Nama:</b> ${data.nama}<br>
            <span style="color:#c62828;">Tiket Sudah Digunakan!</span>
          `;
        } else if (data.status === "NOT_FOUND") {
          hasilDiv.className = "not-found";
          hasilDiv.innerHTML = `❌ ID (${decodedText}) Tidak Terdaftar!`;
        } else {
          hasilDiv.className = "not-found";
          hasilDiv.innerHTML = "⚠️ " + (data.pesan || "Terjadi kesalahan!");
        }

        setTimeout(() => { isScanning = false; }, 3000);
      });
    },
    function(errorMessage) {}
  ).catch(err => {
    alert("Gagal membuka kamera: " + err);
  });
</script>

</body>
</html>
