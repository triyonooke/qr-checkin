<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    font-family:Arial;
    text-align:center;
    margin:20px;
}

#reader{
    width:320px;
    margin:auto;
}

#hasil{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
    color:blue;
}

</style>

</head>

<body>

<h2>SCAN QR PESERTA</h2>

<div id="reader"></div>

<div id="hasil">
Silakan arahkan kamera ke QR Code
</div>

<script>

const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
    {
        facingMode: "environment"
    },
    {
        fps: 10,
        qrbox: 250
    },
    function(decodedText){
        console.log(decodedText);

        document.getElementById("hasil").innerHTML =
        "QR : " + decodedText;

    },
    function(errorMessage){
        // abaikan error scan
    }

).catch(err=>{

    alert(err);

});

</script>

</body>
</html>
