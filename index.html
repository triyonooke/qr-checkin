<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tes Kamera</title>

<style>

body{
    text-align:center;
    font-family:Arial;
}

video{
    width:90%;
    max-width:450px;
    border:2px solid black;
    border-radius:10px;
}

</style>

</head>

<body>

<h2>TES KAMERA</h2>

<video id="video" autoplay playsinline></video>

<script>

const video=document.getElementById("video");

navigator.mediaDevices.getUserMedia({

    video:{
        facingMode:"environment"
    }

})
.then(stream=>{

    video.srcObject=stream;

})
.catch(err=>{

    alert(err);

});

</script>

</body>
</html>
